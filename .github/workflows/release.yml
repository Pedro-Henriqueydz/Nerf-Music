name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename generated APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk nerf-music-${{ github.ref_name }}.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: nerf-music-${{ github.ref_name }}.apk
          body: |
            ## O que há de novo na versão ${{ github.ref_name }}
            • Gesto 1:1 de arrastar para baixo para recolher o Player completo em direção ao Mini Player com morphing contínuo da capa (300dp → 46dp) e fade suave dos controles
            • Animação orgânica de barras equalizadoras de áudio premium, pausando responsivamente ao pausar a reprodução
            • Troca imediata de música via gesto lateral no player de capa e mini cover com transição suave no modo Spotify Canvas
            • Fila de reprodução dinâmica com rolagem aninhada fluida e estados adaptativos
          generate_release_notes: false
