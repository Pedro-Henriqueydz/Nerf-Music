name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select release ref
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"

      - name: Checkout selected release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Select version-specific release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          test -f "$notes_file"
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nerf-release.jks"
          chmod 600 "$RUNNER_TEMP/nerf-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nerf-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nerf-release.jks"

      - name: Rename generated APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk nerf-music-${{ inputs.release_tag || github.ref_name }}.apk

      - name: Remove previous APK asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release delete-asset "$RELEASE_TAG" "nerf-music-$RELEASE_TAG.apk" --yes || true

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: nerf-music-${{ inputs.release_tag || github.ref_name }}.apk
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          generate_release_notes: false
