name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    # Ignore force-updates of existing tags during history cleanup.
    if: github.event.created == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nerf-release.jks"
          chmod 600 "$RUNNER_TEMP/nerf-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nerf-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nerf-release.jks"

      - name: Rename generated APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk nerf-music-${{ github.ref_name }}.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: nerf-music-${{ github.ref_name }}.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
